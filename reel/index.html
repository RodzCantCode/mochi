<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape Morph Loop</title>
<meta name="viewport" content="width=1440">
<!--
  Un único elemento que se transforma en 12 estados de interfaz al ritmo de 120 BPM.
  Todo estilo se calcula dentro de seek(t) a partir del tiempo: sin transiciones CSS,
  sin temporizadores y sin estado entre fotogramas.

  Parámetros de la URL:
    ?t=3.2    congela el fotograma en ese segundo
    ?play     reproduce en bucle con audio (audio/mix.wav); clic para empezar
    ?render   no arranca nada: render.mjs llama a seek(t) fotograma a fotograma
    ?fit      encoge el lienzo 1440x1440 para verlo entero en ventanas pequeñas
-->
<style>
@font-face {
  font-family: "Geist";
  src: url("node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2") format("woff2");
  font-weight: 100 900;
  font-display: block;
}
:root {
  --canvas: #EAE7E2;
  --ink: #0D0D0E;
  --paper: #FFFFFF;
  --accent: #1F6BFF;
  --on-ink-2: rgba(255,255,255,.56);
  --on-ink-3: rgba(255,255,255,.50);
  --on-paper-2: rgba(13,13,14,.50);
  --on-paper-3: rgba(13,13,14,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--canvas); }
body { overflow: hidden; }
#stage {
  position: relative; width: 1440px; height: 1440px; overflow: hidden;
  background: var(--canvas);
  font-family: "Geist", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  transform-origin: 0 0;
}
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#shape { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 50% 50%; }
#inner { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.a { position: absolute; left: 0; top: 0; white-space: nowrap; }
.grp { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.row { display: flex; align-items: center; }
.num { font-variant-numeric: tabular-nums; }
svg { display: block; overflow: visible; }
#cursor { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* contenido: tamaños en unidades de mundo; la cámara los escala */
.btn-label { font-size: 19px; font-weight: 520; color: #fff; gap: 8px; }
.art { background: #2A2A2D; overflow: hidden; }
.art i { position: absolute; border-radius: 50%; }
.bar { position: absolute; left: 0; top: 0; width: 3.5px; border-radius: 2px; background: #fff; }
.title { font-size: 18px; font-weight: 600; color: #fff; }
.artist { font-size: 15px; font-weight: 440; color: var(--on-ink-2); }
.time { font-size: 13px; font-weight: 500; color: var(--on-ink-2); }
.prog { position: absolute; left: 0; top: 0; overflow: hidden; background: rgba(255,255,255,.2); }
.prog > div { position: absolute; left: 0; top: 0; height: 100%; background: #fff; }
.track { position: absolute; left: 0; top: 0; background: var(--paper); }
.knob { position: absolute; left: 0; top: 0; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.10); }
.tabs { position: absolute; left: 0; top: 0; display: flex; }
.tabs > div { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 530; }
.tabs.lo > div { color: var(--on-ink-2); }
.tabs.hi > div { color: var(--ink); }
.seg { position: absolute; left: 0; top: 0; background: rgba(255,255,255,.09); }
.label2 { font-size: 14px; font-weight: 480; color: var(--on-ink-2); }
.big { font-size: 32px; font-weight: 620; color: #fff; letter-spacing: -0.025em; }
.delta { font-size: 13px; font-weight: 520; color: #fff; background: rgba(255,255,255,.1); padding: 4px 8px; border-radius: 8px; }

.tip { background: #fff; border-radius: 10px; padding: 7px 11px 8px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }

.rows { position: absolute; left: 0; top: 0; }

.prow .lbl { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); font-size: 15px; font-weight: 510; }

.rows.hi .lbl, .rows.hi .sc { color: #fff; }
.toast-t { font-size: 16px; font-weight: 520; color: #fff; }
.toast-u { font-size: 15px; font-weight: 520; color: var(--on-ink-2); }
</style>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Tiempo
const CFG = JSON.parse(document.getElementById("timeline").textContent);
const BEAT = 60 / CFG.bpm;
const T = CFG.bars * 4 * BEAT; // 14 s: duración del bucle
const E = {};
for (const [k, [bar, beat, sub]] of Object.entries(CFG.events)) E[k] = ((bar - 1) * 4 + (beat - 1) + sub) * BEAT;

// ---------------------------------------------------------------------------
// Muelles en forma cerrada. resp = periodo natural (s), damp = amortiguación.
// Con damp >= 0.84 el rebote máximo es inferior al 1 %.
function spring(resp, damp) {
  const w0 = 2 * Math.PI / resp;
  return { w0, z: damp, wd: w0 * Math.sqrt(Math.max(1e-6, 1 - damp * damp)) };
}
const SP = {
  morph:  spring(0.42, 0.86),
  snappy: spring(0.26, 0.88),
  press:  spring(0.14, 0.95),
  lead:   spring(0.20, 0.86),
  trail:  spring(0.42, 0.88),
  cam:    spring(0.56, 0.93),
  cursor: spring(0.40, 0.92),
  lazy:   spring(0.62, 0.95),
  drag:   spring(0.52, 0.96),
  fadeIn: spring(0.24, 1),
  fadeOut:spring(0.13, 1),
  draw:   spring(0.62, 1),
  color:  spring(0.30, 1),
  back:   spring(0.34, 0.84),
  jump:   null,
};
// respuesta a un escalón 0 → 1
function stepResp(dt, s) {
  if (dt <= 0) return 0;
  if (s === null) return 1;
  const { w0, z, wd } = s;
  if (z >= 1) { const u = w0 * dt; return 1 - Math.exp(-u) * (1 + u); }
  const e = Math.exp(-z * w0 * dt);
  return 1 - e * (Math.cos(wd * dt) + (z * w0 / wd) * Math.sin(wd * dt));
}
// respuesta libre desde un desplazamiento x0 y una velocidad v0 respecto al objetivo
function freeResp(dt, x0, v0, s) {
  if (dt <= 0) return x0;
  const { w0, z, wd } = s;
  if (z >= 1) { const e = Math.exp(-w0 * dt); return e * (x0 + (v0 + w0 * x0) * dt); }
  const e = Math.exp(-z * w0 * dt);
  return e * (x0 * Math.cos(wd * dt) + ((v0 + z * w0 * x0) / wd) * Math.sin(wd * dt));
}
// impulso: sube y se apaga, pico 1 en dt = 1/w
const imp = (dt, w) => (dt > 0 ? w * dt * Math.exp(1 - w * dt) : 0);

// Pista: un valor que cambia de objetivo varias veces es la suma de un muelle por
// cambio. Es periódica: el valor inicial es el último objetivo y se suman los
// eventos de la vuelta anterior, así t = 0 y t = T coinciden en valor y velocidad.
const TRACKS = []; // registro para comprobar el empalme del bucle
function track(events) {
  const fn = trackFn(events);
  TRACKS.push(fn);
  return fn;
}
function trackFn(events) {
  const ev = events
    .map(e => ({ t: e[0], v: e[1], s: e[2] === undefined ? SP.morph : e[2] }))
    .sort((a, b) => a.t - b.t);
  const vec = Array.isArray(ev[0].v);
  const init = ev[ev.length - 1].v;
  let prev = init;
  for (const e of ev) { e.d = vec ? e.v.map((x, i) => x - prev[i]) : e.v - prev; prev = e.v; }
  if (vec) return t => {
    const out = init.slice();
    for (let k = -1; k <= 0; k++) for (const e of ev) {
      const s = stepResp(t - e.t - k * T, e.s);
      if (s) for (let i = 0; i < out.length; i++) out[i] += e.d[i] * s;
    }
    return out;
  };
  return t => {
    let out = init;
    for (let k = -1; k <= 0; k++) for (const e of ev) {
      const s = stepResp(t - e.t - k * T, e.s);
      if (s) out += e.d * s;
    }
    return out;
  };
}
// Visibilidad de una capa de contenido: sale rápido, entra algo después y más despacio,
// para que el texto que se cambia dentro de la forma no se solape.
function vis(enter, exit, o = {}) {
  return track([[enter + (o.delay ?? 0.06), 1, o.in ?? SP.fadeIn], [exit + (o.exitDelay ?? 0), 0, o.out ?? SP.fadeOut]]);
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const mod = (x, m) => ((x % m) + m) % m;
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };

// ---------------------------------------------------------------------------
// Colores (RGB)
const INK = [13, 13, 14], PAPER = [255, 255, 255], ACCENT = [31, 107, 255];
const rgb = c => `rgb(${c[0].toFixed(1)},${c[1].toFixed(1)},${c[2].toFixed(1)})`;

// ---------------------------------------------------------------------------
// Estados de la forma, en unidades de mundo. z = zoom de cámara que llena el cuadro.
const ST = {
  button:   { w: 212, h: 60,  r: 30, bg: INK,   cx: 0, cy: 0,   z: 3.5 },
  loader:   { w: 60,  h: 60,  r: 30, bg: INK,   cx: 0, cy: 0,   z: 4.6 },
  check:    { w: 60,  h: 60,  r: 30, bg: INK,   cx: 0, cy: 0,   z: 4.6 },
  island:   { w: 250, h: 60,  r: 30, bg: INK,   cx: 0, cy: 0,   z: 3.05 },
  player:   { w: 360, h: 232, r: 40, bg: INK,   cx: 0, cy: 0,   z: 2.2 },
  slider:   { w: 330, h: 64,  r: 32, bg: INK,   cx: 0, cy: 0,   z: 2.55 },
  toggle:   { w: 76,  h: 44,  r: 22, bg: INK,   cx: 0, cy: 0,   z: 4.6 },
  tabs:     { w: 360, h: 48,  r: 24, bg: INK,   cx: 0, cy: 0,   z: 2.3 },
  chart:    { w: 420, h: 312, r: 32, bg: INK,   cx: 0, cy: 124, z: 1.95 },
  key:      { w: 92,  h: 64,  r: 20, bg: PAPER, cx: 0, cy: 0,   z: 4.4 },
  palette5: { w: 440, h: 273, r: 22, bg: PAPER, cx: 0, cy: 0,   z: 1.9 },
  palette3: { w: 440, h: 193, r: 22, bg: PAPER, cx: 0, cy: -40, z: 2.1 },
  palette1: { w: 440, h: 113, r: 22, bg: PAPER, cx: 0, cy: -80, z: 2.25 },
  toast:    { w: 292, h: 60,  r: 30, bg: INK,   cx: 0, cy: 0,   z: 2.9 },
};
const SEQ = [
  [E.toLoader, "loader"], [E.toCheck, "check"], [E.toIsland, "island"], [E.toPlayer, "player"],
  [E.scrubRelease, "slider"], [E.toToggle, "toggle"], [E.toTabs, "tabs"], [E.toChart, "chart"],
  [E.toKey, "key"], [E.toPalette, "palette5"], [E.type1, "palette3"], [E.type2, "palette1"],
  [E.enter, "toast"], [E.toButton, "button"],
];
const seqTrack = (key, s, extra = []) => track(SEQ.map(([t, n]) => [t, ST[n][key], s]).concat(extra));

const shapeW = seqTrack("w", SP.morph);

// Valores de manipulación directa. Mientras el cursor está pulsado, el valor sale de
// su posición; al soltar, un muelle lo lleva de vuelta desde donde estuviera.
function cursorWorld(t) {
  return toWorld(curX(t), curY(t), camZ(t), camX(t), camY(t));
}
function progress(t) {
  if (t < E.playPress) return P0;
  if (t < E.scrubGrab) return P0 + (t - E.playPress) / SONG;
  const g0 = P0 + (E.scrubGrab - E.playPress) / SONG;
  const x0 = cursorWorld(E.scrubGrab)[0];
  if (t < E.scrubRelease) return clamp(g0 + (cursorWorld(t)[0] - x0) / PROG_W);
  // ya oculto: vuelve al valor de partida para que el bucle empalme
  if (t > E.scrubRelease + 1) return P0;
  const rel = clamp(g0 + (cursorWorld(E.scrubRelease)[0] - x0) / PROG_W);
  return rel + (t - E.scrubRelease) / SONG;
}
const rubber = (d, dim = 110, c = 0.55) => (1 - 1 / (d * c / dim + 1)) * dim;
const REVEAL = E.scrubRelease + 0.1;
const volIntro = t => (t < E.scrubRelease ? 1 : VOL0 + (1 - VOL0) * (1 - stepResp(t - REVEAL, SP.morph)));
function volRaw(t) {
  const x0 = cursorWorld(E.volGrab)[0];
  return volIntro(E.volGrab) + (cursorWorld(t)[0] - x0) / VOL_W;
}
function volume(t) {
  // fuera de la ventana del slider (ya oculto) vale 1: la forma es negra entera
  if (t < E.scrubRelease || t > E.volRelease + 1) return 1;
  if (t < E.volGrab) return volIntro(t);
  if (t < E.volRelease) return clamp(volRaw(t));
  return clamp(volRaw(E.volRelease));
}
function stretch(t) {
  if (t < E.volGrab || t > E.volRelease + 1) return 0;
  const over = r => rubber(Math.max(0, r - 1) * VOL_W);
  if (t < E.volRelease) return over(volRaw(t));
  const dt = 1 / 240;
  const s0 = over(volRaw(E.volRelease));
  const v0 = (s0 - over(volRaw(E.volRelease - dt))) / dt;
  return freeResp(t - E.volRelease, s0, v0, SP.back);
}

// barras del reproductor: botan con cada pulso una vez que suena
const BAR_SEED = [0.9, 0.55, 1, 0.7, 0.45, 0.85, 0.6, 1, 0.75, 0.5, 0.95, 0.65];
function barHeight(t, i) {
  const base = 4;
  if (t < E.playPress || t > E.scrubRelease + 0.3) return base;
  const on = smooth(E.playPress, E.playPress + 0.12, t);
  let h = 0;
  const k0 = Math.floor(t / (BEAT / 2));
  for (let k = k0 - 2; k <= k0; k++) {
    const tb = k * BEAT / 2;
    if (tb < E.playPress - 0.01) continue;
    const amp = BAR_SEED[(k * 3 + i * 5) % BAR_SEED.length] * (k % 2 === 0 ? 1 : 0.55);
    h += amp * imp(t - tb, 22);
  }
  return base + on * Math.min(1.2, h) * 12;
}

function put(el, x, y, o = {}) {

function rect(el, l, t, w, h, r) {

// aplica visibilidad a un grupo: opacidad, desenfoque (constante en pantalla) y escala
function show(el, v, z, px0 = 0, py0 = 0, o = {}) {
  const u = clamp(v);
  el.style.opacity = u.toFixed(4);
  const b = (1 - u) * (o.blur ?? 14) / z;
  el.style.filter = b > 0.02 ? `blur(${b.toFixed(3)}px)` : "none";
  const s = lerp(o.s0 ?? 0.94, 1, u);
  el.style.transform = `translate(${px0}px,${py0}px) scale(${s}) translate(${-px0}px,${-py0}px)`;
  el.style.visibility = u < 0.002 ? "hidden" : "visible";
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function ppPaths(p) {
  // play (dos mitades de triángulo) → pausa (dos barras)
  const A0 = [[7, 5], [12.5, 8.2], [12.5, 15.8], [7, 19]], A1 = [[6.5, 5], [10, 5], [10, 19], [6.5, 19]];
  const B0 = [[12.5, 8.2], [19, 12], [19, 12], [12.5, 15.8]], B1 = [[14, 5], [17.5, 5], [17.5, 19], [14, 19]];
  const mk = (P0, P1) => "M" + P0.map((q, i) => `${lerp(q[0], P1[i][0], p).toFixed(3)} ${lerp(q[1], P1[i][1], p).toFixed(3)}`).join("L") + "Z";
  return [mk(A0, A1), mk(B0, B1)];
}
function chartPath() {
  // Catmull-Rom → Bézier
  const P = DATA.map((_, i) => [px(i), py(i)]);
  let d = `M${P[0][0]} ${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
  }
  return d;
}

// seek(t): todo el fotograma es función pura de t
function seek(tIn) {
  const t = mod(tIn, T);
  const z = camZ(t), ccx = camX(t), ccy = camY(t);
  D.world.style.transform = `translate(720px,720px) scale(${z}) translate(${-ccx}px,${-ccy}px)`;

  // forma
  const st = stretch(t);
  let w = shapeW(t) + st, h = shapeH(t) - st * 0.2;
  const cx = shapeCX(t) + st / 2, cy = shapeCY(t);
  const r = Math.min(shapeR(t), h / 2, w / 2);
  const left = cx - w / 2, top = cy - h / 2;
  const bg = shapeBG(t);
  const white = clamp(shapeWhite(t));
  const sh = D.shape.style;
  sh.width = `${w}px`; sh.height = `${h}px`; sh.borderRadius = `${r}px`;
  sh.background = rgb(bg);
  sh.transform = `translate(${left}px,${top}px) scale(${shapeScale(t)})`;
  sh.boxShadow = `0 1px 1.5px rgba(0,0,0,${(0.05 + 0.03 * white).toFixed(3)}), 0 10px 28px -10px rgba(0,0,0,${(0.10 + 0.10 * white).toFixed(3)})`;
  D.inner.style.transform = `translate(${-left}px,${-top}px)`;

  // botón
  show(D.gBtn, V.btn(t), z);
  put(D.btnLabel, 4, 0);

  // cargador → check
  const vl = V.loader(t);
  show(D.gLoader, vl, z, 0, 0, { s0: 0.7 });
  if (vl > 0.002) {
    const tug = imp(t - E.loaderTug, 14) * 0.2;
    const len = clamp(loaderLen(t) + tug, 0, 1);
    D.loaderArc.setAttribute("stroke-dasharray", `${len.toFixed(4)} 1`);
    const ang = (t - E.toLoader) * 520 + imp(t - E.loaderTug, 14) * 40 - 90;
    D.loader.style.transform = `translate(-50%,-50%) rotate(${ang.toFixed(2)}deg)`;
  }
  const vc = V.check(t);
  show(D.gCheck, vc, z, 0, 0, { s0: 0.8, blur: 6 });
  if (vc > 0.002) {
    D.checkPath.setAttribute("stroke-dasharray", `${clamp(checkDraw(t)).toFixed(4)} 1`);
    D.check.style.transform = "translate(-50%,-50%)";
  }

  // island → reproductor
  const vm = V.media(t);
  const as = artS(t);
  D.art.style.opacity = clamp(vm).toFixed(4);
  D.art.style.visibility = vm < 0.002 ? "hidden" : "visible";
  D.art.style.filter = vm < 0.998 ? `blur(${((1 - clamp(vm)) * 12 / z).toFixed(3)}px)` : "none";
  rect(D.art, artX(t) - as / 2, artY(t) - as / 2, as, as, artR(t));
  const bs = barsS(t);
  D.bars.style.opacity = clamp(vm).toFixed(4);
  D.bars.style.visibility = vm < 0.002 ? "hidden" : "visible";
  D.bars.style.transform = `translate(${barsX(t)}px,${barsY(t)}px) scale(${bs})`;
  D.barEls.forEach((b, i) => {
    const bh = barHeight(t, i);
    b.style.height = `${bh}px`;
    b.style.transform = `translate(${-11.75 + i * 7}px,${-bh / 2}px)`;
  });

  const vp = V.player(t), vk = V.controls(t);
  show(D.gPlayer, vp, z, 0, 0, { s0: 0.97 });
  if (vp > 0.002) {
    put(D.pTitle, -84, -76, { ax: 0 });
    put(D.pArtist, -84, -52, { ax: 0 });
    const p = progress(t), ph = progH(t);
    rect(D.pProg, PROG_L, PROG_Y - ph / 2, PROG_W, ph, ph / 2);
    D.pFill.style.width = `${(p * PROG_W).toFixed(3)}px`;
    put(D.pT0, PROG_L, PROG_Y + 24, { ax: 0 });
    put(D.pT1, PROG_L + PROG_W, PROG_Y + 24, { ax: 1 });
    D.pT0.textContent = fmt(p * SONG);
    D.pT1.textContent = "-" + fmt(SONG - p * SONG);
    const ctrl = `opacity:${clamp(vk).toFixed(4)}`;
    for (const [el, x, s] of [[D.pPrev, -76, 26], [D.pNext, 76, 26], [D.pPP, 0, 36]]) {
      el.style.cssText = ctrl;
      put(el, x, 80, { s: lerp(0.9, 1, clamp(vk)) });
    }
    const pp = ppPaths(clamp(playP(t), 0, 1.02));
    D.ppA.setAttribute("d", pp[0]);
    D.ppB.setAttribute("d", pp[1]);
  }

  // slider de volumen
  const vs = V.slider(t);
  const v = volume(t);
  const fillR = left + w * v; // con la forma asentada equivale a VOL_L + VOL_W * v
  const onSlider = t >= E.scrubRelease && t < E.toToggle + 0.3;
  D.sTrack.style.visibility = onSlider && v < 0.999 ? "visible" : "hidden";
  rect(D.sTrack, fillR, top - 1, left + w + 1 - fillR, h + 2);
  show(D.gSlider, vs, z, 0, 0, { s0: 0.98, blur: 10 });
  if (vs > 0.002) {
    const ix = VOL_L + 34, iy = 0, is = 26;
    put(D.sIcoLo, ix, iy);
    put(D.sIcoHi, ix, iy);
    const clipR = clamp(ix + is / 2 - fillR, 0, is);
    D.sIcoHi.style.clipPath = `inset(0 ${clipR.toFixed(3)}px 0 0)`;
    for (const box of [D.sIcoLo, D.sIcoHi]) {
      const ws = box.querySelectorAll(".w1,.w2,.w3");
      ws[0].style.opacity = smooth(0.02, 0.1, v);
      ws[1].style.opacity = smooth(0.38, 0.48, v);
      ws[2].style.opacity = smooth(0.72, 0.82, v);
    }
  }

  // toggle / indicador y pestañas
  const vkn = V.knob(t);
  const kL = knobL(t), kR = knobR(t), kT = knobT(t), kB = knobB(t), kr = Math.min(knobRad(t), (kB - kT) / 2);
  D.knob.style.opacity = clamp(vkn).toFixed(4);
  D.knob.style.visibility = vkn < 0.002 ? "hidden" : "visible";
  D.knob.style.filter = vkn < 0.998 ? `blur(${((1 - clamp(vkn)) * 10 / z).toFixed(3)}px)` : "none";
  const ks = lerp(0.6, 1, clamp(vkn));
  const kcx = (kL + kR) / 2, kcy = (kT + kB) / 2;
  D.knob.style.transform = `translate(${kcx}px,${kcy}px) scale(${ks}) translate(${-(kR - kL) / 2}px,${-(kB - kT) / 2}px)`;
  D.knob.style.width = `${kR - kL}px`;
  D.knob.style.height = `${kB - kT}px`;
  D.knob.style.borderRadius = `${kr}px`;

  const vt = V.tabs(t);
  const rL = rowL(t), rR = rowR(t);
  for (const el of [D.tabsLo, D.tabsHi]) {
    rect(el, rL, -20, rR - rL, 40);
    el.style.opacity = clamp(vt).toFixed(4);
    el.style.visibility = vt < 0.002 ? "hidden" : "visible";
    el.style.filter = vt < 0.998 ? `blur(${((1 - clamp(vt)) * 12 / z).toFixed(3)}px)` : "none";
  }
  D.tabsHi.style.clipPath = `inset(${kT + 20}px ${rR - kR}px ${20 - kB}px ${kL - rL}px round ${kr}px)`;
  const so = clamp(segO(t)) * clamp(vt);
  rect(D.seg, rL, -20, rR - rL, 40, 20);
  D.seg.style.opacity = so.toFixed(4);

  // gráfica
  const vch = V.chart(t);
  show(D.gChart, vch, z, 0, 124, { s0: 0.97 });
  if (vch > 0.002) {
    const dp = clamp(drawP(t));
    put(D.cLabel, -190, 50, { ax: 0 });
    put(D.cBig, -190, 82, { ax: 0 });
    put(D.cDelta, 190, 50, { ax: 1 });
    D.cBig.textContent = "$" + (Math.round(48290 * dp / 10) * 10).toLocaleString("en-US");
    put(D.cSvg, -190, 100, { ax: 0, ay: 0 });
    D.cLine.setAttribute("stroke-dasharray", `${dp.toFixed(4)} 1`);
    const ed = clamp(endDot(t), 0, 1.2);
    D.cEnd.setAttribute("cx", px(DATA.length - 1));
    D.cEnd.setAttribute("cy", py(DATA.length - 1));
    D.cEnd.setAttribute("r", (4.5 * ed).toFixed(3));
    const xs = [-190, -95, 0, 95, 190], axs = [0, 0.5, 0.5, 0.5, 1];
    D.cX.forEach((el, i) => put(el, xs[i], 258, { ax: axs[i] }));
  }
  const vtp = V.tip(t) * clamp(vch);
  const tx = tipX(t), ty = tipY(t);
  D.cGuide.setAttribute("x1", tx.toFixed(3));
  D.cGuide.setAttribute("x2", tx.toFixed(3));
  D.cGuide.style.opacity = clamp(vtp).toFixed(4);
  D.cDot.setAttribute("cx", tx.toFixed(3));
  D.cDot.setAttribute("cy", ty.toFixed(3));
  D.cDot.setAttribute("r", (5.5 * clamp(vtp)).toFixed(3));
  show(D.gTip, vtp, z, tx, ty, { s0: 0.9 });
  if (vtp > 0.002) {
    put(D.tip, tx, ty - 16, { ay: 1 });
    put(D.tipBWrap, tx, ty - 16, { ay: 1 });
    const a = clamp(V.tipA(t)), b = clamp(V.tipB(t));
    D.tipA.style.opacity = a; D.tipA.style.filter = a < 0.998 ? `blur(${((1 - a) * 8 / z).toFixed(3)}px)` : "none";
    D.tipB.style.opacity = b; D.tipB.style.filter = b < 0.998 ? `blur(${((1 - b) * 8 / z).toFixed(3)}px)` : "none";
    D.tipA.style.visibility = a < 0.002 ? "hidden" : "visible";
    D.tipB.style.visibility = b < 0.002 ? "hidden" : "visible";
  }

  // revelados de color
  for (const [el, p] of [[D.revW, revW(t)], [D.revK, revK(t)]]) {
    el.style.visibility = p > 0.001 ? "visible" : "hidden";
    rect(el, cx - (w * p) / 2, cy - (h * p) / 2, w * p, h * p, r * p);
  }

  // ⌘K
  show(D.gKey, V.key(t), z, 0, 0, { s0: 0.85 });
  put(D.keyLabel, 0, 0);

  // paleta de comandos
  const vpal = V.pal(t);
  show(D.gPal, vpal, z, 0, PAL_TOP, { s0: 0.97 });
  if (vpal > 0.002) {
    const iy = PAL_TOP + 28;
    put(D.palSearch, -196, iy);
    const txt = typedText(t);
    D.palPh.style.visibility = txt ? "hidden" : "visible";
    put(D.palPh, -178, iy, { ax: 0 });
    D.palText.textContent = txt;
    put(D.palTyped, -178, iy, { ax: 0 });
    const typing = t >= E.type1 - 0.02 && t < E.enter + 0.1;
    D.palCaret.style.opacity = typing || mod(t, BEAT) < BEAT * 0.55 ? 1 : 0;
    put(D.palEsc, 200, iy, { ax: 1 });
    rect(D.palDiv, -220, PAL_TOP + 56, 440, 1);
    rect(D.palHl, -212, ROW0 - 18, 424, 36, 10);
    D.palHl.style.transform += ` scale(${rowPress(t)})`;
    const hiClip = `inset(${ROW0 - 18 - (PAL_TOP + 56)}px 8px ${(PAL_TOP + 56 + 220) - (ROW0 + 18)}px 8px round 10px)`;
    for (const box of [D.rowsLo, D.rowsHi]) rect(box, -220, PAL_TOP + 56, 440, 220);
    D.rowsHi.style.clipPath = hiClip;
    const hs = clamp(hintSwap(t));
    for (let i = 0; i < ROWS.length; i++) {
      const y = ROW0 + 40 * rowIdx[i](t) - (PAL_TOP + 56) - 20;
      const rv = clamp(rowVis[i](t));
      for (const el of [D.rl[i], D.rh[i]]) {
        el.style.width = "440px";
        el.style.transform = `translate(0px,${y.toFixed(3)}px) scale(${lerp(0.96, 1, rv)})`;
        el.style.opacity = rv.toFixed(4);
        el.style.filter = rv < 0.998 ? `blur(${((1 - rv) * 10 / z).toFixed(3)}px)` : "none";
        el.style.visibility = rv < 0.002 ? "hidden" : "visible";
        const sk = el.querySelector(".sk"), se = el.querySelector(".se");
        if (se) {
          sk.style.opacity = 1 - hs; se.style.opacity = hs;
          sk.style.filter = hs > 0.002 && hs < 0.998 ? `blur(${(hs * 6 / z).toFixed(3)}px)` : "none";
          se.style.filter = hs > 0.002 && hs < 0.998 ? `blur(${((1 - hs) * 6 / z).toFixed(3)}px)` : "none";
        }
      }
    }
  }

  // toast
  show(D.gToast, V.toast(t), z, 0, 0, { s0: 0.96 });
  put(D.toastIco, -118, 0);
  put(D.toastT, -98, 0, { ax: 0 });
  put(D.toastU, 122, 0, { ax: 1 });

  // cursor
  const cs = curScale(t);
  const CS = 1.6;
  D.cursor.style.transform = `translate(${(curX(t) - 2 * CS).toFixed(3)}px,${(curY(t) - 2 * CS).toFixed(3)}px) scale(${(CS * cs).toFixed(4)})`;
}

// ---------------------------------------------------------------------------
function init() {
  hydrateIcons(document.body);
  buildRows();
  D = {
    world: $("world"), shape: $("shape"), inner: $("inner"),
    gBtn: $("g-btn"), btnLabel: $("btn-label"),
    gLoader: $("g-loader"), loader: $("loader"), loaderArc: $("loader-arc"),
    gCheck: $("g-check"), check: $("check"), checkPath: $("check-path"),
    art: $("art"), bars: $("bars"), barEls: [...$("bars").children],
    gPlayer: $("g-player"), pTitle: $("p-title"), pArtist: $("p-artist"), pProg: $("p-prog"), pFill: $("p-fill"),
    pT0: $("p-t0"), pT1: $("p-t1"), pPrev: $("p-prev"), pNext: $("p-next"), pPP: $("p-pp"), ppA: $("pp-a"), ppB: $("pp-b"),
    gSlider: $("g-slider"), sTrack: $("s-track"), sIcoLo: $("s-ico-lo"), sIcoHi: $("s-ico-hi"),
    knob: $("knob"), tabsLo: $("tabs-lo"), tabsHi: $("tabs-hi"), seg: $("seg"),
    gChart: $("g-chart"), cLabel: $("c-label"), cBig: $("c-big"), cDelta: $("c-delta"), cSvg: $("c-svg"),
    cLine: $("c-line"), cEnd: $("c-end"), cDot: $("c-dot"), cGuide: $("c-guide"),
    cX: [0, 1, 2, 3, 4].map(i => $("c-x" + i)),
    gTip: $("g-tip"), tip: $("tip"), tipBWrap: $("tip-b-wrap"), tipA: $("tip-a"), tipB: $("tip-b"),
    gKey: $("g-key"), keyLabel: $("key-label"),
    gPal: $("g-pal"), palSearch: $("pal-search"), palPh: $("pal-ph"), palTyped: $("pal-typed"), palText: $("pal-text"),
    palCaret: $("pal-caret"), palEsc: $("pal-esc"), palDiv: $("pal-div"), palHl: $("pal-hl"),
    rowsLo: $("rows-lo"), rowsHi: $("rows-hi"),
    rl: ROWS.map((_, i) => $("rl" + i)), rh: ROWS.map((_, i) => $("rh" + i)),
    revW: $("rev-w"), revK: $("rev-k"),
    gToast: $("g-toast"), toastIco: $("toast-ico"), toastT: $("toast-t"), toastU: $("toast-u"),
    cursor: $("cursor"),
  };
  D.cLine.setAttribute("d", chartPath());
}

// ---------------------------------------------------------------------------
// Modos de uso
window.T = T; window.E = E; window.seek = seek;
// valores numéricos de todas las pistas y manipulaciones, para comprobar el empalme
window.probe = t => TRACKS.flatMap(f => f(t)).concat([progress(t), volume(t), stretch(t), ...[0, 1, 2, 3].map(i => barHeight(t, i))]);
window.ready = (async () => {
  await document.fonts.load('500 16px "Geist"');
  await document.fonts.ready;
  init();
  const q = new URLSearchParams(location.search);
  if (q.has("fit")) {
    const s = Math.min(innerWidth, innerHeight) / 1440;
    $("stage").style.transform = `scale(${s})`;
  }
  if (q.has("render")) { seek(0); return true; }
  if (q.has("t")) { seek(+q.get("t")); return true; }
  // reproducción en tiempo real: solo llama a seek con el reloj del audio o del navegador
  const audio = q.has("play") ? new Audio("audio/mix.wav") : null;
  if (audio) { audio.loop = true; addEventListener("click", () => audio.play(), { once: true }); }
  const t0 = performance.now();
  const loop = () => {
    const t = audio && !audio.paused ? audio.currentTime : (performance.now() - t0) / 1000;
    seek(t);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  return true;
})();
</script>
</body>
