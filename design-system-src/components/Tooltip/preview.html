<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tooltip</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--mochi-canvas); }
  #root { min-height: 100%; box-sizing: border-box; display: flex; align-items: flex-end; justify-content: center; padding: 24px 24px 32px; font: var(--mochi-text-body); color: var(--mochi-on-canvas); }
  .bar { display: flex; gap: 6px; padding: 6px; border-radius: 9999px; background: var(--mochi-surface); box-shadow: var(--mochi-shadow-surface); }
  .bar .mochi-morph[data-tone="surface"] { background: transparent; box-shadow: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var M = window.Mochi, h = React.createElement;
  function Demo() {
    var tools = [["Rename", M.PencilIcon], ["Duplicate", M.CopyIcon], ["Share", M.ShareIcon], ["Delete", M.TrashIcon]];
    return h("div", { className: "bar" }, tools.map(function (t) {
      return h(M.Tooltip, { key: t[0], content: t[0] },
        h(M.Button, { variant: "surface", size: "sm", iconOnly: true, "aria-label": t[0] }, h(t[1], { size: 18 })));
    }));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
