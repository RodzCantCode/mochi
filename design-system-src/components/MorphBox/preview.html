<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MorphBox</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--mochi-canvas); }
  #root { min-height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 24px; font: var(--mochi-text-body); color: var(--mochi-on-canvas); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var M = window.Mochi, h = React.createElement, useState = React.useState, useEffect = React.useEffect;
  function Demo() {
    var s = useState(0);
    useEffect(function () { var id = setInterval(function () { s[1](function (x) { return (x + 1) % 3; }); }, 1500); return function () { clearInterval(id); }; }, []);
    var states = [
      { key: "label", tone: "solid", body: h("span", { style: { display: "inline-flex", alignItems: "center", gap: 8 } }, "Get started", h(M.ArrowRightIcon, { size: 18 })) },
      { key: "wait", tone: "solid", width: 48, body: h(M.Spinner, { size: 22 }) },
      { key: "done", tone: "surface", body: h("span", { style: { display: "inline-flex", alignItems: "center", gap: 8 } }, h(M.CheckCircleIcon, { size: 20 }), "All set") },
    ];
    var c = states[s[0]];
    return h(M.MorphBox, { contentKey: c.key, tone: c.tone, height: 48, width: c.width, padding: c.width ? "0" : "0 20px" }, c.body);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script>
</body>
</html>
